<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Waste Segregation Assistant</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0f8f5;
      padding: 30px;
      text-align: center;
    }

    h1 {
      color: #2e7d32;
    }

    select, button {
      padding: 10px;
      font-size: 16px;
      margin-top: 10px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }

    button {
      background-color: #2e7d32;
      color: white;
      cursor: pointer;
      border: none;
    }

    button:hover {
      background-color: #1b5e20;
    }
  </style>
</head>
<body>

  <h1>Smart Recycling  Assistant</h1>
  <p>Select an item to know which bin it belongs to:</p>

  <select id="wasteType">
    <option value="">-- Choose an item --</option>
    <option value="banana">Banana</option>
    <option value="plastic-bottle">Plastic Bottle</option>
    <option value="glass-jar">Glass Jar</option>
    <option value="paper">Paper</option>
    <option value="battery">Battery</option>
    <option value="medicine">Expired Medicine</option>
    <option value="food-wrapper">Food Wrapper</option>
    <option value="clothes">Old Clothes</option>
  </select>
  <br>
  <button type="button" onclick="showCategory()">Check Category</button>
  <p id="result" role="status" aria-live="polite"></p>

  <script>
    const categories = {
      banana: "Organic waste: place it in your local food-scraps or compost collection.",
      "plastic-bottle": "Recyclable in many areas: empty and rinse it, then use your local plastics recycling bin.",
      "glass-jar": "Often recyclable: empty and rinse it, then use your local glass recycling collection.",
      paper: "Recyclable when clean and dry. Greasy or food-soiled paper may belong in compost or general waste.",
      battery: "Special disposal: take it to a battery collection point. Do not put batteries in household recycling or trash.",
      medicine: "Use a pharmacy or community medicine take-back service. Do not flush it unless the label or local guidance says to.",
      "food-wrapper": "Usually general waste, unless your local program specifically accepts this type of wrapper.",
      clothes: "Donate wearable clothes or use a textile collection point; textile recycling availability varies locally."
    };

    function showCategory() {
      const selected = document.getElementById("wasteType").value;
      document.getElementById("result").textContent = categories[selected]
        || "Please select an item first.";
    }
  </script>

</body>
</html>
